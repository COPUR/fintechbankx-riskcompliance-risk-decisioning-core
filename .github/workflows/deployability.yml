name: Deployability

# Proves every change still produces a runnable image and valid deployment
# manifests. Nothing is pushed or applied from here.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  container:
    name: deploy/container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag risk-decisioning-service:${{ github.sha }} .
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' risk-decisioning-service:${{ github.sha }})"
          echo "image user: $user"
          test "$user" = "10001:10001"

  helm:
    name: deploy/helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install kubeconform
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          # Asset per runner architecture (hosted amd64, fbx-ci arm64), each checked against the release's sha256
          # (governance ci-runner/tool-downloads-by-arch.snippet.sh).
          case "$(uname -m)" in
            x86_64) kubeconform_arch=amd64; kubeconform_sha=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73 ;;
            aarch64|arm64) kubeconform_arch=arm64; kubeconform_sha=dc82f79bb03c5479b1ae5fd4af221e4b5a3111f62bf01a2795d9c5c20fa96644 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$tmpdir/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-${kubeconform_arch}.tar.gz"
          echo "${kubeconform_sha}  $tmpdir/kubeconform.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/kubeconform.tar.gz"
          sudo install "$tmpdir/kubeconform" /usr/local/bin/kubeconform
          rm -rf "$tmpdir"
      # verify-vendored-guard.sh needs node 18 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The datasource / TLS guard (fbx.guard) is templates/_fbx_helpers.tpl, a whole, header-less copy of the
      # platform chart's _helpers.tpl (README "Vendoring the guard", step 1). The script, copied from the same
      # commit, checks (a) the copy's sha256, (b) that no other file of the chart defines an fbx.* template and
      # (c) that every workload template runs fbx.guard (here through risk.guard) before it writes anything.
      # Re-copy both files and re-pin the digest and commit below whenever that chart's guard changes.
      - name: Vendored platform guard
        run: |
          # COPUR/fintechbankx-platform-delivery-iac-cicd-templates
          # charts/fintechbankx-service/templates/_helpers.tpl at 73e1881
          bash scripts/ci/verify-vendored-guard.sh deploy/helm/risk-decisioning-service 4f2cdfe056f5afce0297f699c8b66cb80dc42e8e311759bf4a973f8a15b28b2d
      - name: Lint and render chart
        run: bash scripts/ci/chart-render-probes.sh

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # Offline runs with a mocked AWS provider (tests/*.tftest.hcl): the IRSA role writes only evt.rsk.risk.v1;
      # only the secrets KMS key carries fintechbankx.io/secrets and var.tags cannot add it.
      - run: terraform test

  data-split:
    name: deploy/data-split-rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backfill
          POSTGRES_PASSWORD: backfill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backfill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: backfill
      PGPASSWORD: backfill
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse monolith-to-service credit risk backfill and reconciliation
        run: scripts/migration/verify-backfill.sh
      # scripts/ops/load-high-risk-countries.sh on a migrated scratch database: a load replaces the list in one
      # transaction; an empty file, a code that is not alpha-2 or a conninfo with a password is refused and changes nothing.
      - name: Rehearse the high-risk country list load
        run: scripts/migration/verify-high-risk-country-load.sh
      # db/bootstrap/roles.sql twice on a fresh database and once more after the migrations ran as the owner:
      # idempotent, LOGIN roles without passwords, the owner owns the schema, the runtime role has only V11's grants.
      - name: Rehearse the DBA role bootstrap
        run: scripts/ci/check-role-bootstrap.sh
