name: Deployability

# Proves every change still produces a runnable image and valid deployment
# manifests. Nothing is pushed or applied from here.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  container:
    name: deploy/container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag risk-decisioning-service:${{ github.sha }} .
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' risk-decisioning-service:${{ github.sha }})"
          echo "image user: $user"
          test "$user" = "10001:10001"

  helm:
    name: deploy/helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install kubeconform
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          curl -sSfL -o "$tmpdir/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $tmpdir/kubeconform.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/kubeconform.tar.gz"
          sudo install "$tmpdir/kubeconform" /usr/local/bin/kubeconform
          rm -rf "$tmpdir"
      # The datasource / TLS guard (fbx.guard) is vendored from fintechbankx-platform-delivery-iac-cicd-templates
      # charts/fintechbankx-service/templates/_helpers.tpl at a4f0072, unchanged; only a header comment is added.
      # Re-copy it (and update both pins) whenever that chart's guard changes.
      - name: Vendored guard is unchanged
        run: |
          f=deploy/helm/risk-decisioning-service/templates/_fbx_helpers.tpl
          want=1fd684735383301baf3052c5d8978dd86edee1ac1c66ebfb944a8a6a166f4c92
          # The header is the first Go-template comment: from line 1 "{{- /*" to the first line "*/ -}}".
          test "$(head -n 1 "$f")" = '{{- /*'
          header="$(sed -n '1,/^\*\/ -}}$/p' "$f")"
          grep -q 'fintechbankx-platform-delivery-iac-cicd-templates' <<<"$header"
          grep -q 'charts/fintechbankx-service/templates/_helpers.tpl' <<<"$header"
          grep -q 'a4f0072' <<<"$header"
          grep -q "$want" <<<"$header"
          got="$(sed '1,/^\*\/ -}}$/d' "$f" | sha256sum | cut -d' ' -f1)"
          if [ "$got" != "$want" ]; then
            echo "$f differs from cicd-templates a4f0072 (sha256 $got, want $want)" >&2; exit 1
          fi
          # Every template that renders a workload calls the guard through the chart's adapter.
          for t in deployment.yaml migration-job.yaml; do
            head -n 1 "deploy/helm/risk-decisioning-service/templates/$t" | grep -qx '{{- include "risk.guard" . -}}'
          done
      - name: Lint and render chart
        run: |
          chart=deploy/helm/risk-decisioning-service
          args="--set image.repository=ci/risk-decisioning-service --set image.tag=${{ github.sha }} --set externalSecret.remoteSecretName=ci/risk-decisioning-service/db-app"
          # Schema owner credential, read only by the Flyway migration Job (decision 0002).
          args="$args --set externalSecret.migrationSecretName=ci/risk-decisioning-service/db-migration"
          args="$args --set config.DB_URL=jdbc:postgresql://ci:5432/db?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"
          args="$args --set config.KAFKA_BOOTSTRAP_SERVERS=ci:9098"
          args="$args --set config.OIDC_ISSUER_URI=https://ci/realms/fintechbankx --set config.OIDC_JWK_SET_URI=https://ci/certs"
          # Empty required settings must fail the render, not produce pods that cannot start.
          if helm template ci "$chart" --set image.repository=ci/x --set image.tag=x --set externalSecret.remoteSecretName=ci/risk-decisioning-service/db-app > /dev/null 2>&1; then
            echo "chart rendered without required runtime config"; exit 1
          fi
          helm lint "$chart" $args
          helm template ci "$chart" $args > /dev/null
          helm template ci "$chart" -f "$chart/values-dev.yaml" $args > /dev/null
          rendered="$(helm template ci "$chart" $args)"
          # Aurora TLS (cicd-templates 4f0f266): a PostgreSQL DB_URL without sslmode=verify-full must fail the render.
          if out="$(helm template ci "$chart" $args --set 'config.DB_URL=jdbc:postgresql://ci:5432/db?sslmode=require' 2>&1)"; then
            echo "chart rendered a DB_URL without sslmode=verify-full" >&2; exit 1
          fi
          grep -q "sslmode=verify-full" <<<"$out"
          # Ways around a substring check on DB_URL must fail too, each with its own message:
          # a repeated sslmode (PgJDBC keeps the last), a decoy sslrootcert, a non-validating
          # sslfactory, a second URL in another config key, and sslmode=verify-full hidden in a value.
          bundle=/etc/fintechbankx/rds-ca/global-bundle.pem
          base=jdbc:postgresql://ci:5432/db
          reject_render() {
            local want="$1"; shift
            local out
            if out="$(helm template ci "$chart" $args "$@" 2>&1)"; then
              echo "chart rendered with $*" >&2; exit 1
            fi
            if ! grep -qF -- "$want" <<<"$out"; then
              echo "render with $* failed without \"$want\": $out" >&2; exit 1
            fi
          }
          reject_render "config.DB_URL must set sslmode exactly once (found 2)" --set "config.DB_URL=$base?sslmode=verify-full&sslrootcert=$bundle&sslmode=disable"
          reject_render "config.DB_URL must set sslrootcert=$bundle exactly once (the databaseCa bundle)" --set "config.DB_URL=$base?sslmode=verify-full&sslrootcert=/tmp/decoy.pem"
          reject_render "config.DB_URL must not set sslfactory" --set "config.DB_URL=$base?sslmode=verify-full&sslrootcert=$bundle&sslfactory=org.postgresql.ssl.NonValidatingFactory"
          # sslfactoryarg feeds a custom factory; service= loads host, port and TLS settings from a pg_service.conf
          # entry the chart cannot see.
          reject_render "config.DB_URL must not set sslfactoryarg" --set "config.DB_URL=$base?sslmode=verify-full&sslrootcert=$bundle&sslfactoryarg=x"
          reject_render "config.DB_URL must not set service" --set "config.DB_URL=$base?sslmode=verify-full&sslrootcert=$bundle&service=pgsvc"
          # PgJDBC reads parameter names case-sensitively (lower case): SSLMODE=verify-full is ignored by the driver,
          # so a differently-cased sslmode or sslrootcert is refused instead of being counted as the verified one,
          # and a verification override is refused in any case (SslFactory).
          reject_render "config.DB_URL must spell SSLMODE in lower case" --set "config.DB_URL=$base?SSLMODE=verify-full&sslrootcert=$bundle"
          reject_render "config.DB_URL must spell SSLROOTCERT in lower case" --set "config.DB_URL=$base?sslmode=verify-full&SSLROOTCERT=$bundle"
          reject_render "config.DB_URL must not set sslfactory" --set "config.DB_URL=$base?sslmode=verify-full&sslrootcert=$bundle&SslFactory=org.postgresql.ssl.NonValidatingFactory"
          # The vendored guard (fbx.guard) refuses every datasource override name with one message.
          override="is not allowed: it can redirect or override the datasource past the sslmode=verify-full check"
          reject_render "config.SPRING_DATASOURCE_URL $override" --set "config.SPRING_DATASOURCE_URL=$base?sslmode=disable"
          reject_render "config.SPRING_FLYWAY_URL $override" --set "config.SPRING_FLYWAY_URL=$base?sslmode=disable"
          # Every Spring datasource, Flyway, Liquibase and R2DBC key is refused by prefix, not only the URL ones.
          for key in SPRING_LIQUIBASE_URL SPRING_R2DBC_URL SPRING_DATASOURCE_DRIVER_CLASS_NAME SPRING_FLYWAY_USER 'spring\.r2dbc\.url'; do
            reject_render "config.${key//\\/} $override" \
              --set "config.$key=$base?sslmode=disable"
          done
          # The guard lets SPRING_DATASOURCE_USERNAME and _PASSWORD through; this chart does not: the runtime role is
          # config.DB_USERNAME and its password comes only from the ExternalSecret, never from the ConfigMap.
          # (the guard's exemption is the exact name in any case; other spellings it refuses itself).
          for key in SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD spring_datasource_password; do
            reject_render "config.$key must not be set: the runtime role is config.DB_USERNAME" \
              --set "config.$key=x"
          done
          reject_render "config.spring.datasource.password $override" --set 'config.spring\.datasource\.password=x'
          # SPRING_FLYWAY_LOCATIONS would point validate-at-start at another migration set (an empty one validates
          # nothing), so a pending or changed migration would no longer keep a pod from starting.
          reject_render "config.SPRING_FLYWAY_LOCATIONS $override" \
            --set config.SPRING_FLYWAY_LOCATIONS=classpath:nowhere
          reject_render "config.spring.flyway.locations $override" \
            --set 'config.spring\.flyway\.locations=classpath:nowhere'
          # Spring config locations and imports load property sources that can override DB_URL
          # (spring.datasource.url from a file or configtree), in every relaxed spelling.
          for key in SPRING_CONFIG_IMPORT 'spring\.config\.import' SPRING_CONFIG_IMPORT_0 \
              SPRING_CONFIG_ADDITIONAL_LOCATION SPRING_CONFIG_ADDITIONALLOCATION 'spring\.config\.additional-location' \
              SPRING_CONFIG_LOCATION 'spring\.config\.location' 'spring_config_location'; do
            reject_render "config.${key//\\/} is not allowed: a spring.config.* property" \
              --set "config.$key=optional:file:/tmp/override.yml"
          done
          # ...and every spring.config.* key, including the file name (SPRING_CONFIG_NAME picks another application-*.yml).
          reject_render "config.SPRING_CONFIG_NAME is not allowed: a spring.config.* property" \
            --set config.SPRING_CONFIG_NAME=override
          reject_render "config.spring.config.name is not allowed: a spring.config.* property" \
            --set 'config.spring\.config\.name=override'
          reject_render "config.DB_URL must use sslmode=verify-full (with sslrootcert=$bundle)" --set "config.DB_URL=$base?sslmode=require&applicationName=sslmode=verify-full"
          # Keys are matched after normalisation (upper case, every non-alphanumeric character dropped), so a
          # dash inside an element, a dot or an index spelling cannot slip a second URL or a config location past
          # the check: Spring's relaxed binding reads all of them.
          reject_render "config.spring.datasource.hikari.jdbc-url $override" \
            --set "config.spring\.datasource\.hikari\.jdbc-url=$base?sslmode=disable"
          reject_render "config.SPRING-DATASOURCE-URL $override" \
            --set "config.SPRING-DATASOURCE-URL=$base?sslmode=disable"
          reject_render "config.SPRING_CONFIG-IMPORT is not allowed: a spring.config.* property" \
            --set "config.SPRING_CONFIG-IMPORT=optional:file:/tmp/override.yml"
          reject_render "config.spring.config.import[0] is not allowed: a spring.config.* property" \
            --set "config.spring\.config\.import\[0\]=optional:file:/tmp/override.yml"
          # JVM option variables would load an agent or set system properties (spring.datasource.url included)
          # before application.yml is read; the image fixes them.
          # The chart refuses every JVM option name in config, whatever the value (the guard would allow a harmless one);
          # the guard's message comes first when the value names a datasource.
          for key in JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS JAVA_OPTS java-tool-options; do
            reject_render "config.$key must not be set: JVM options are fixed by the image" \
              --set "config.$key=-XX:+UseZGC"
          done
          for key in JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS; do
            reject_render "config.$key must not mention datasource" \
              --set "config.$key=-Dspring.datasource.url=$base?sslmode=disable"
          done
          for key in JAVA_OPTS java-tool-options; do
            reject_render "config.$key must not be set: JVM options are fixed by the image" \
              --set "config.$key=-Dspring.datasource.url=$base?sslmode=disable"
          done
          # Log levels are not install-time values: LOGGING_LEVEL_ORG_POSTGRESQL=TRACE would write the wire
          # protocol, with row data, to the pod log.
          reject_render "config.LOGGING_LEVEL_ORG_POSTGRESQL must not be set: log levels are not install-time values" \
            --set "config.LOGGING_LEVEL_ORG_POSTGRESQL=TRACE"
          reject_render "config.logging.level.root must not be set: log levels are not install-time values" \
            --set "config.logging\.level\.root=DEBUG"
          # DB_SSL_ROOT_CERT is the bundle the TLS startup assertions (DatabaseTlsGuard, KafkaTlsGuard; on by default)
          # verify against; the chart sets it from the mounted bundle on every container, and the service refuses to
          # start without it. A config key, empty or not and in any spelling, is refused.
          reject_render "config.DB_SSL_ROOT_CERT is not allowed: a TLS parameter name can replace the mounted CA" \
            --set-string 'config.DB_SSL_ROOT_CERT='
          reject_render "config.DB_SSL_ROOT_CERT is not allowed: a TLS parameter name can replace the mounted CA" \
            --set-string 'config.DB_SSL_ROOT_CERT=/tmp/decoy.pem'
          reject_render "config.db.ssl.root.cert is not allowed: a TLS parameter name can replace the mounted CA" \
            --set-string 'config.db\.ssl\.root\.cert='
          # The assertions have one switch, fintechbankx.tls.enforce=false, for the local profile and tests only; the
          # guard refuses every fintechbankx.tls.* config key in every spelling, so no install-time value turns them off.
          tls_switch="it can switch off the service's startup TLS assertion"
          reject_render "config.FINTECHBANKX_TLS_ENFORCE is not allowed: $tls_switch" \
            --set-string 'config.FINTECHBANKX_TLS_ENFORCE=false'
          reject_render "config.fintechbankx.tls.enforce is not allowed: $tls_switch" \
            --set-string 'config.fintechbankx\.tls\.enforce=false'
          reject_render "config.FINTECHBANKX-TLS-ENFORCE is not allowed: $tls_switch" \
            --set-string 'config.FINTECHBANKX-TLS-ENFORCE=true'
          reject_render "config.fintechbankx.tls.enforce[0] is not allowed: $tls_switch" \
            --set-string 'config.fintechbankx\.tls\.enforce\[0\]=false'
          # ...and the fully separator-free spellings the guard lets through (its rule wants a separator or the
          # end after "tls"); this chart refuses every config key whose normalised form (upper case, every
          # non-alphanumeric character dropped) starts with FINTECHBANKXTLS, like its other normalised rules.
          tls_chart="must not be set: fintechbankx.tls.enforce is the test switch of the TLS startup assertions"
          reject_render "config.FINTECHBANKXTLSENFORCE $tls_chart" --set-string 'config.FINTECHBANKXTLSENFORCE=false'
          reject_render "config.FintechbankxTlsEnforce $tls_chart" --set-string 'config.FintechbankxTlsEnforce=false'
          reject_render "config.fintechbankxtlsenforce $tls_chart" --set-string 'config.fintechbankxtlsenforce=false'
          # (the guard itself still refuses the spellings with a separator after "tls", before the chart's rule)
          for key in FINTECHBANKX_TLS_ENFORCE 'fintechbankx\.tls\.enforce' FINTECHBANKXTLS_ENFORCE FINTECHBANKXTLS; do
            reject_render "config.${key//\\/} is not allowed: $tls_switch" --set-string "config.$key=false"
          done
          # The local profile is for a developer machine (plain-text local services). The chart renders the only
          # profile, SPRING_PROFILES_ACTIVE from kafka.runtime, so the guard refuses every spring.profiles.* config key,
          # in every spelling, whatever it names.
          reject_render "config.SPRING_PROFILES_ACTIVE is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_ACTIVE=local'
          reject_render "config.SPRING_PROFILES_ACTIVE is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_ACTIVE=Kafka-Strimzi\,LOCAL'
          reject_render "config.SPRING_PROFILES_INCLUDE is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_INCLUDE=x\, local'
          reject_render "config.spring.profiles.active[1] is not allowed: a profile can activate" \
            --set-string 'config.spring\.profiles\.active\[1\]=local'
          reject_render "config.SPRING_PROFILES_ACTIVE_0 is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_ACTIVE_0=x \, local'
          reject_render "config.spring.profiles.include is not allowed: a profile can activate" \
            --set-string 'config.spring\.profiles\.include=Local'
          # The default profile and profile groups are other ways to the same profile: a group that names local
          # activates it together with the group's profile (kafka-msk, for instance).
          reject_render "config.SPRING_PROFILES_DEFAULT is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_DEFAULT=local'
          reject_render "config.SPRING_PROFILES_DEFAULT_0 is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_DEFAULT_0=local'
          reject_render "config.SPRING_PROFILES_GROUP_KAFKA-MSK is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_GROUP_KAFKA-MSK=local'
          reject_render "config.spring.profiles.group.kafka-msk[0] is not allowed: a profile can activate" \
            --set-string 'config.spring\.profiles\.group\.kafka-msk\[0\]=local'
          reject_render "config.SPRING_PROFILES_GROUP_KAFKA_MSK is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_GROUP_KAFKA_MSK=kafka-msk\, Local'
          # ...including the Kafka profiles themselves and a name that only contains "local".
          reject_render "config.SPRING_PROFILES_ACTIVE is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_ACTIVE=kafka-strimzi\,localhost'
          reject_render "config.SPRING_PROFILES_GROUP_KAFKA_MSK is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_GROUP_KAFKA_MSK=kafka-msk\,localhost'
          reject_render "config.SPRING_PROFILES_ACTIVE is not allowed: a profile can activate" \
            --set-string 'config.SPRING_PROFILES_ACTIVE=kafka-msk'
          # kafka.runtime selects the Kafka auth profile (msk -> kafka-msk, SASL_SSL with IAM; strimzi -> kafka-strimzi,
          # SSL with the KafkaUser certificate from kafkaTls.secretName). The Deployment gets it as SPRING_PROFILES_ACTIVE,
          # the ConfigMap never; the migration Job needs no Kafka profile.
          check_profile() {
            python3 -c '
          import sys, yaml
          want, tls = sys.argv[1], sys.argv[2]
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          cm = [d for d in docs if d["kind"] == "ConfigMap"][0]
          assert not any("PROFILES" in k.upper().replace("_", "").replace(".", "").replace("-", "") for k in cm["data"]), cm["data"]
          app = [d for d in docs if d["kind"] == "Deployment"][0]["spec"]["template"]["spec"]["containers"][0]
          env = {e["name"]: e for e in app.get("env", [])}
          assert env["SPRING_PROFILES_ACTIVE"].get("value") == want, env.get("SPRING_PROFILES_ACTIVE")
          refs = {n: env[n]["valueFrom"]["secretKeyRef"] for n in ("KAFKA_TLS_CERT", "KAFKA_TLS_KEY", "KAFKA_TLS_CA") if n in env}
          if tls:
              assert refs == {"KAFKA_TLS_CERT": {"name": tls, "key": "user.crt"}, "KAFKA_TLS_KEY": {"name": tls, "key": "user.key"},
                              "KAFKA_TLS_CA": {"name": tls, "key": "ca.crt"}}, refs
          else:
              assert not refs, refs
          job = [d for d in docs if d["kind"] == "Job"][0]["spec"]["template"]["spec"]["containers"][0]
          assert not any(e["name"].startswith(("SPRING_PROFILES", "KAFKA_TLS")) for e in job.get("env", [])), job.get("env")
          print("profile", want, "kafka tls", tls or "-")
          ' "$1" "${2:-}"
          }
          check_profile kafka-msk <<<"$rendered"
          strimzi="--set kafka.runtime=strimzi --set config.KAFKA_SECURITY_PROTOCOL=SSL --set kafkaTls.secretName=kafka-client-tls"
          helm template ci "$chart" $args $strimzi | check_profile kafka-strimzi kafka-client-tls
          reject_render "kafkaTls.secretName is required for kafka.runtime strimzi" \
            --set kafka.runtime=strimzi --set config.KAFKA_SECURITY_PROTOCOL=SSL
          reject_render "config.KAFKA_SECURITY_PROTOCOL must be SSL with kafka.runtime strimzi" \
            --set kafka.runtime=strimzi --set kafkaTls.secretName=kafka-client-tls
          reject_render "config.KAFKA_SECURITY_PROTOCOL must be SASL_SSL with kafka.runtime msk" \
            --set config.KAFKA_SECURITY_PROTOCOL=SSL
          reject_render "config.KAFKA_SECURITY_PROTOCOL must be SASL_SSL or SSL" \
            --set config.KAFKA_SECURITY_PROTOCOL=PLAINTEXT
          reject_render "config.SPRING_KAFKA_PRODUCER_SECURITY_PROTOCOL must be SASL_SSL or SSL" \
            --set config.SPRING_KAFKA_PRODUCER_SECURITY_PROTOCOL=SASL_PLAINTEXT
          reject_render "config.SPRING_KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM must be https" \
            --set-string config.SPRING_KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=
          reject_render "config.KAFKA_SECURITY_PROTOCOL is set but kafka.runtime is empty" --set-string kafka.runtime=
          reject_render "kafka.runtime must be msk or strimzi: this service always configures a Kafka producer" \
            --set-string kafka.runtime= --set config.KAFKA_SECURITY_PROTOCOL=null
          reject_render 'kafka.runtime must be "", msk or strimzi' --set-string 'kafka.runtime=kafka-msk\,local'
          # Routes the chart does not render are refused, not ignored: an envFrom source or ExternalSecret dataFrom
          # (keys the guard never sees), and an extraEnv, env or javaToolOptions value (the image fixes JVM options).
          reject_render "envFrom is not supported" --set 'envFrom[0].configMapRef.name=other'
          reject_render "extraEnvFrom is not supported" --set 'extraEnvFrom[0].secretRef.name=other'
          reject_render "externalSecret.dataFrom is not supported" --set 'externalSecret.dataFrom[0].extract.key=ci/risk-decisioning-service/db-app'
          for route in 'extraEnv[0].name=SPRING_CONFIG_IMPORT' 'env[0].name=X' 'javaToolOptions=-XX:+UseZGC'; do
            reject_render "${route%%[[=]*} is not a value of this chart" --set "$route"
          done
          # Template interpolation (cicd-templates README "Vendoring the guard", step 3 and 4): keys and values are
          # quoted, so a newline in a value cannot open another key, and a key or secret name with a newline or quote
          # is refused before it is written.
          inject="$(mktemp)"
          printf '%s\n' 'config:' '  "OIDC_AUDIENCE\nSPRING_CONFIG_IMPORT": "file:/tmp/x"' > "$inject"
          reject_render "config key \"OIDC_AUDIENCE\\nSPRING_CONFIG_IMPORT\" is not a ConfigMap key" -f "$inject"
          printf '%s\n' 'config:' "  'SERVICE_CALLERS\"': x" > "$inject"
          reject_render 'is not a ConfigMap key' -f "$inject"
          # (--set-file, because it overrides the --set of $args; the file's text, newline included, is the value).
          printf '%s\n' 'ci/risk-decisioning-service/db-app' '        property: username' > "$inject"
          reject_render "externalSecret.data remoteSecretName" --set-file "externalSecret.remoteSecretName=$inject"
          reject_render "must not contain a control character" --set-file "externalSecret.remoteSecretName=$inject"
          printf '%s\n' 'ci/risk-decisioning-service/db-migration' '        property: x' > "$inject"
          reject_render "externalSecret.extraData remoteSecretName" --set-file "externalSecret.migrationSecretName=$inject"
          printf '%s\n' 'config:' '  SERVICE_CALLERS: "svc-a\nSPRING_CONFIG_IMPORT: file:/tmp/x"' \
            '  DB_USERNAME: "risk_decisioning_app\n              - name: SPRING_DATASOURCE_URL"' > "$inject"
          helm template ci "$chart" $args -f "$inject" | python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          cm = [d for d in docs if d["kind"] == "ConfigMap"][0]["data"]
          assert cm["SERVICE_CALLERS"] == "svc-a\nSPRING_CONFIG_IMPORT: file:/tmp/x", cm["SERVICE_CALLERS"]
          assert not any("CONFIG" in k for k in cm), sorted(cm)
          job = [d for d in docs if d["kind"] == "Job"][0]["spec"]["template"]["spec"]["containers"][0]
          names = [e["name"] for e in job["env"]]
          assert names == ["DB_URL", "DB_USERNAME", "DB_SSL_ROOT_CERT"], names
          print("a newline in a config value stays inside its value (ConfigMap and migration Job env)")
          '
          rm -f "$inject"
          # Kubernetes expands $(VAR) in env[].value from earlier entries and envFrom keys after the render: no env value
          # the chart writes may contain it (DB_URL is refused by the guard, every other value by the chart).
          reject_render "config.DB_URL must not contain '\${' or '\$('" --set-string 'config.DB_URL=jdbc:postgresql://ci:5432/db?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&user=$(DB_MIGRATION_USERNAME)'
          reject_render "DB_USERNAME must not contain '\$('" --set-string 'config.DB_USERNAME=$(DB_MIGRATION_USERNAME)'
          # The chart has no extraEnv or env list, so the ConfigMap is the only route for a config key; make sure
          # nobody adds one without routing it through the same check.
          helm show values "$chart" | python3 -c '
          import sys, yaml
          values = yaml.safe_load(sys.stdin)
          if any(k in values for k in ("extraEnv", "env", "envFrom", "extraEnvFrom", "javaToolOptions")):
              sys.exit("values.yaml offers an env list that bypasses the config-key check")
          '
          # ... and the RDS CA bundle is mounted read-only, not optional, and exported as DB_SSL_ROOT_CERT,
          # always: there is no switch to turn it off (this service always has a PostgreSQL database).
          # The Deployment and the Flyway migration Job (decision 0002) both connect to Aurora, so both are checked.
          check_database_ca() {
          python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          workloads = [d for d in docs if d.get("kind") in ("Deployment", "Job")]
          assert [d["kind"] for d in workloads].count("Deployment") == 1, "expected one Deployment"
          assert [d["kind"] for d in workloads].count("Job") == 1, "expected one migration Job"
          for w in workloads:
              where = w["kind"] + "/" + w["metadata"]["name"]
              pod = w["spec"]["template"]["spec"]
              vols = {v["name"]: v for v in pod.get("volumes", [])}
              ca = vols.get("database-ca", {}).get("configMap")
              assert ca and ca["name"] == "rds-ca-bundle" and not ca.get("optional", False), f"{where} database-ca volume: {ca}"
              items = ca.get("items")
              assert items == [{"key": "global-bundle.pem", "path": "global-bundle.pem"}], f"{where}: {items}"
              for c in pod["containers"]:
                  container = where + " " + c["name"]
                  mounts = [m for m in c.get("volumeMounts", []) if m["name"] == "database-ca"]
                  assert mounts == [{"name": "database-ca", "mountPath": "/etc/fintechbankx/rds-ca", "readOnly": True}], f"{container}: {mounts}"
                  env = {e["name"]: e.get("value") for e in c.get("env", [])}
                  assert env.get("DB_SSL_ROOT_CERT") == "/etc/fintechbankx/rds-ca/global-bundle.pem", f"{container}: {env}"
          print(f"database CA mounted read-only and DB_SSL_ROOT_CERT set in {len(workloads)} workloads")
          '
          }
          check_database_ca <<<"$rendered"
          helm template ci "$chart" -f "$chart/values-dev.yaml" $args | check_database_ca
          # A leftover databaseCa.enabled=false in an environment's values must not drop the mount.
          helm template ci "$chart" $args --set databaseCa.enabled=false | check_database_ca
          if helm show values "$chart" | python3 -c 'import sys, yaml; sys.exit("enabled" not in yaml.safe_load(sys.stdin)["databaseCa"])'; then
            echo "values.yaml still offers databaseCa.enabled" >&2; exit 1
          fi
          # Strict schema validation of every rendered manifest (CRDs from the datree catalog).
          # Schemas from pinned commits, not moving refs (same pins as compliance).
          k8s='https://raw.githubusercontent.com/yannh/kubernetes-json-schema/39a87cd29966bc0b3434e8cfbc2061782c8cb69a/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json'
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          kubeconform_args=(-strict -summary -kubernetes-version 1.30.0 -schema-location "$k8s" -schema-location "$crds")
          kubeconform "${kubeconform_args[@]}" - <<<"$rendered"
          helm template ci "$chart" -f "$chart/values-dev.yaml" $args | kubeconform "${kubeconform_args[@]}" -
          helm template ci "$chart" $args $strimzi | kubeconform "${kubeconform_args[@]}" -
          python3 -c 'import yaml' 2>/dev/null || pip install --user pyyaml==6.0.2
          sa="$(helm show values "$chart" | python3 -c 'import sys, yaml; print(yaml.safe_load(sys.stdin)["serviceAccount"]["name"])')"
          # Pod label the platform outbox alert rules key on (service_id).
          python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d and d.get("kind") == "Deployment"]
          labels = [d["spec"]["template"]["metadata"].get("labels", {}) for d in docs]
          if not labels or any(l.get("fintechbankx.io/service-id") != "svc-rsk-decisioning" for l in labels):
              sys.exit("Deployment pod template must carry fintechbankx.io/service-id: svc-rsk-decisioning")
          ' <<<"$rendered"
          # Platform convention (cicd-templates 335a345): app pods carry app.kubernetes.io/component=service,
          # and every selector that picks them (Service, PDB, topology spread) includes it.
          python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          want = ("app.kubernetes.io/component", "service")
          errors = []
          def has(labels, where):
              if (labels or {}).get(want[0]) != want[1]:
                  errors.append(where)
          kinds = {d["kind"] for d in docs}
          for k in ("Deployment", "Service", "PodDisruptionBudget"):
              if k not in kinds:
                  errors.append(f"no {k} rendered")
          for d in docs:
              name = d["kind"] + "/" + d["metadata"]["name"]
              if d["kind"] == "Deployment":
                  spec = d["spec"]
                  has(spec["template"]["metadata"].get("labels"), f"{name} pod labels")
                  has(spec["selector"].get("matchLabels"), f"{name} selector")
                  for i, c in enumerate(spec["template"]["spec"].get("topologySpreadConstraints", [])):
                      has(c["labelSelector"].get("matchLabels"), f"{name} topologySpreadConstraints[{i}]")
              elif d["kind"] == "Service":
                  has(d["spec"].get("selector"), f"{name} selector")
              elif d["kind"] == "PodDisruptionBudget":
                  has(d["spec"]["selector"].get("matchLabels"), f"{name} selector")
          if errors:
              sys.exit("missing app.kubernetes.io/component=service: " + ", ".join(errors))
          ' <<<"$rendered"
          # Platform contract: mesh and network policy belong to the service-mesh repo (mesh #11 allows
          # payments -> risk ingress), secrets to the one ClusterSecretStore.
          if grep -qE "kind: (PeerAuthentication|AuthorizationPolicy|NetworkPolicy|SecretStore)$" <<<"$rendered"; then
            echo "chart must not ship mesh or network policies or its own SecretStore" >&2
            exit 1
          fi
          # (the templates quote every interpolated value, so match with or without quotes)
          grep -qE 'name: "?aws-secrets-manager"?$' <<<"$rendered"
          grep -qE 'app: "?risk-decisioning-service"?$' <<<"$rendered"
          # The relay stays off until the mesh contract gives namespace risk MSK egress (runbook step 4).
          if ! grep -qE '"?OUTBOX_RELAY_ENABLED"?: "false"' <<<"$rendered"; then
            echo "chart must default OUTBOX_RELAY_ENABLED to \"false\"" >&2
            exit 1
          fi
          grep -qE '"?OUTBOX_RELAY_ENABLED"?: "true"' <<<"$(helm template ci "$chart" $args --set config.OUTBOX_RELAY_ENABLED=true)"
          # Metric common tags: app = service account, squad = risk (platform outbox alert rules).
          grep -q "METRICS_APP: \"$sa\"" <<<"$rendered"
          grep -q 'METRICS_SQUAD: "risk"' <<<"$rendered"
          # Every ExternalSecret: app.kubernetes.io/name = service account, keys under <env>/<service account>/.
          ./scripts/ci/check-externalsecrets.py ci "$sa" <<<"$rendered"
          # Flyway runs only in the pre-install/pre-upgrade migration Job (decision 0002; cicd-templates 335a345
          # labels): the app pods never reference the db-migration secret, the Job runs the app image with args
          # [migrate] without an Istio sidecar, its ServiceAccount and the db-migration ExternalSecret are hooks
          # before it and go away once the hooks succeed, and no Service, PDB, NetworkPolicy or Deployment selector
          # matches its component=db-migration pods.
          reject_render "externalSecret.migrationSecretName is required" --set externalSecret.migrationSecretName=
          reject_render "externalSecret.migrationSecretName must be <env>/risk-decisioning-service/" \
            --set externalSecret.migrationSecretName=ci/other-service/db-migration
          # The <env>/<service account>/ prefix is matched literally (regexQuoteMeta on serviceAccount.name, as in
          # customer). It can only ever see a DNS label: risk.guard, the first line of the Job template, refuses any
          # other serviceAccount.name before the prefix rule runs, so a name with a regex metacharacter never reaches
          # it, and a wrong prefix is refused with the prefix message, not matched by accident.
          reject_render "serviceAccount.name must be a DNS label" \
            --set serviceAccount.name=risk.decisioning-service \
            --set externalSecret.migrationSecretName=ci/riskXdecisioning-service/db-migration
          reject_render "externalSecret.migrationSecretName must be <env>/risk-decisioning-service/" \
            --set externalSecret.migrationSecretName=ci/risk-decisioning-servicex/db-migration
          # ...and it must be another secret than the runtime one: a single credential for both would run Flyway
          # and the service as the same role, and V11's insert-only grants (decision 0002) would not hold.
          # Compared trimmed and without a trailing "/", so a spelling variant of the same name is refused too.
          single_user="externalSecret.migrationSecretName must not be the runtime secret (externalSecret.remoteSecretName)"
          reject_render "$single_user" --set externalSecret.migrationSecretName=ci/risk-decisioning-service/db-app
          reject_render "$single_user" --set externalSecret.remoteSecretName=ci/risk-decisioning-service/db-migration
          reject_render "$single_user" --set externalSecret.migrationSecretName=ci/risk-decisioning-service/db-app/
          reject_render "$single_user" --set 'externalSecret.migrationSecretName= ci/risk-decisioning-service/db-app '
          ./scripts/ci/check-migration-job.py "$sa" <<<"$rendered"
          helm template ci "$chart" -f "$chart/values-dev.yaml" $args | ./scripts/ci/check-migration-job.py "$sa"
          grep -q "secretKey: DB_MIGRATION_USERNAME" <<<"$rendered"
          grep -qE 'name: "?risk-decisioning-service-db-migration"?$' <<<"$rendered"
          # ...and the check catches each way back to the old shape.
          mutated() {
            python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          one = lambda kind: [d for d in docs if d["kind"] == kind][0]
          app = one("Deployment")["spec"]["template"]
          job = one("Job")
          migration_secret = [d for d in docs if d["kind"] == "ExternalSecret" and d["metadata"]["name"].endswith("-db-migration")][0]
          exec(sys.argv[1])
          yaml.safe_dump_all(docs, sys.stdout)
          ' "$1" <<<"$rendered"
          }
          reject_mutation() {
            if mutated "$2" | ./scripts/ci/check-migration-job.py "$sa" 2>/dev/null; then
              echo "migration Job check accepted $1" >&2; exit 1
            fi
          }
          reject_mutation "the migration secret in the app pods (envFrom)" \
            'app["spec"]["containers"][0]["envFrom"].append({"secretRef": {"name": "risk-decisioning-service-db-migration"}})'
          reject_mutation "the migration secret in the app pods (secretKeyRef)" \
            'app["spec"]["containers"][0]["env"].append({"name": "DB_MIGRATION_PASSWORD", "valueFrom": {"secretKeyRef": {"name": "risk-decisioning-service-db-migration", "key": "DB_MIGRATION_PASSWORD"}}})'
          reject_mutation "Job pods labelled component=service" \
            'job["spec"]["template"]["metadata"]["labels"]["app.kubernetes.io/component"] = "service"'
          reject_mutation "Job pods without the service account name label" \
            'job["spec"]["template"]["metadata"]["labels"]["app.kubernetes.io/name"] = "flyway"'
          reject_mutation "Job pods without the component label (the mesh selects Aurora egress on name and component)" \
            'del job["spec"]["template"]["metadata"]["labels"]["app.kubernetes.io/component"]'
          reject_mutation "Job pods without the service account name label" \
            'del job["spec"]["template"]["metadata"]["labels"]["app.kubernetes.io/name"]'
          reject_mutation "Job pods with an Istio sidecar" \
            'job["spec"]["template"]["metadata"]["labels"]["sidecar.istio.io/inject"] = "true"'
          reject_mutation "Job pods without the sidecar opt-out" \
            'del job["spec"]["template"]["metadata"]["labels"]["sidecar.istio.io/inject"]'
          reject_mutation "a Job that is not a pre-upgrade hook" \
            'job["metadata"]["annotations"]["helm.sh/hook"] = "pre-install"'
          reject_mutation "a Job without ttlSecondsAfterFinished" 'del job["spec"]["ttlSecondsAfterFinished"]'
          reject_mutation "a Job without activeDeadlineSeconds" 'del job["spec"]["activeDeadlineSeconds"]'
          reject_mutation "a Job without backoffLimit" 'del job["spec"]["backoffLimit"]'
          reject_mutation "a Job with another DB_URL" \
            '[e.update(value="jdbc:postgresql://other:5432/db") for e in job["spec"]["template"]["spec"]["containers"][0]["env"] if e["name"] == "DB_URL"]'
          reject_mutation "a Job with a writable root filesystem" \
            'job["spec"]["template"]["spec"]["containers"][0]["securityContext"]["readOnlyRootFilesystem"] = False'
          reject_mutation "a Job that does not run the migrate mode" \
            'job["spec"]["template"]["spec"]["containers"][0]["args"] = []'
          reject_mutation "a Job on the app ServiceAccount (IAM role, API token)" \
            'job["spec"]["template"]["spec"]["serviceAccountName"] = "risk-decisioning-service"'
          reject_mutation "a migration ExternalSecret kept after the hooks succeed" \
            'migration_secret["metadata"]["annotations"]["helm.sh/hook-delete-policy"] = "before-hook-creation"'
          reject_mutation "a Service selecting by name only" \
            'del one("Service")["spec"]["selector"]["app.kubernetes.io/component"]'
          reject_mutation "a NetworkPolicy selecting the Job pods" \
            'docs.append({"kind": "NetworkPolicy", "metadata": {"name": "np"}, "spec": {"podSelector": {"matchExpressions": [{"key": "app.kubernetes.io/component", "operator": "In", "values": ["db-migration"]}]}}})'
          reject_mutation "a PDB selecting by name only" \
            'del one("PodDisruptionBudget")["spec"]["selector"]["matchLabels"]["app.kubernetes.io/component"]'
          # The database CA check covers the Job: a Job without the bundle or DB_SSL_ROOT_CERT fails it.
          if mutated 'job["spec"]["template"]["spec"]["containers"][0]["env"] = [e for e in job["spec"]["template"]["spec"]["containers"][0]["env"] if e["name"] != "DB_SSL_ROOT_CERT"]' \
              | check_database_ca 2>/dev/null; then
            echo "database CA check accepted a migration Job without DB_SSL_ROOT_CERT" >&2; exit 1
          fi

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # Offline runs with a mocked AWS provider (tests/*.tftest.hcl): the IRSA role writes only evt.rsk.risk.v1;
      # only the secrets KMS key carries fintechbankx.io/secrets and var.tags cannot add it.
      - run: terraform test

  data-split:
    name: deploy/data-split-rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backfill
          POSTGRES_PASSWORD: backfill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backfill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: backfill
      PGPASSWORD: backfill
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse monolith-to-service credit risk backfill and reconciliation
        run: scripts/migration/verify-backfill.sh
      # db/bootstrap/roles.sql twice on a fresh database and once more after the migrations ran as the owner:
      # idempotent, LOGIN roles without passwords, the owner owns the schema, the runtime role has only V11's grants.
      - name: Rehearse the DBA role bootstrap
        run: scripts/ci/check-role-bootstrap.sh
