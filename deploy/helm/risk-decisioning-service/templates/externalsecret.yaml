{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "risk.secretName" . }}
  labels:
    {{- include "risk.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "risk.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        {{- $key := required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName }}
        {{- if not (regexMatch (printf "^[a-z0-9-]+/%s/" .Values.serviceAccount.name) $key) }}
        {{- fail (printf "externalSecret.remoteSecretName must be <env>/%s/..., got %s" .Values.serviceAccount.name $key) }}
        {{- end }}
        key: {{ $key }}
        property: password
{{- end }}
