{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "risk.secretName" . | quote }}
  labels:
    {{- include "risk.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "risk.secretName" . | quote }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        {{- $key := required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName }}
        {{- if not (regexMatch (printf "^[a-z0-9-]+/%s/" .Values.serviceAccount.name) $key) }}
        {{- fail (printf "externalSecret.remoteSecretName must be <env>/%s/..., got %s" .Values.serviceAccount.name $key) }}
        {{- end }}
        key: {{ $key | quote }}
        property: password
---
# Identity client credential (CUSTOMER_CLIENT_CREDENTIAL) and token endpoint (CUSTOMER_TOKEN_URI) of the
# svc-rsk-decisioning realm client, for the client-credentials token the loan-eligibility adapter sends to
# the customer service. One home: Secrets Manager <env>/<service account>/oidc-client (identity
# CLIENT_SECRET_DELIVERY.md), synced here like the runtime database credential; the app pods read the two
# keys with secretKeyRef, the migration Job never mounts this Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "risk.oidcClientSecretName" . | quote }}
  labels:
    {{- include "risk.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "risk.oidcClientSecretName" . | quote }}
    creationPolicy: Owner
  data:
    - secretKey: CUSTOMER_CLIENT_CREDENTIAL
      remoteRef:
        key: {{ include "risk.oidcClientEntry" . | quote }}
        property: client_secret
    - secretKey: CUSTOMER_TOKEN_URI
      remoteRef:
        key: {{ include "risk.oidcClientEntry" . | quote }}
        property: token_uri
{{- end }}
{{- include "risk.requireMigrationSecret" . }}
---
# Schema owner credential (DB_MIGRATION_USERNAME / _PASSWORD), read only by the
# Flyway migration Job (migration-job.yaml). A hook created before the Job and
# deleted after it succeeds, so the Secret exists only while a migration runs.
# The runtime role (DB_USERNAME) gets only the grants of V11.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "risk.migrationSecretName" . | quote }}
  labels:
    {{- include "risk.migrationLabels" . | nindent 4 }}
  annotations:
    {{- include "risk.migrationPrerequisiteHook" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "risk.migrationSecretName" . | quote }}
    creationPolicy: Owner
  data:
    - secretKey: DB_MIGRATION_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.migrationSecretName | quote }}
        property: username
    - secretKey: DB_MIGRATION_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.migrationSecretName | quote }}
        property: password
