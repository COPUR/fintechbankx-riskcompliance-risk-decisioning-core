{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "risk.secretName" . }}
  labels:
    {{- include "risk.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "risk.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        {{- $key := required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName }}
        {{- if not (regexMatch (printf "^[a-z0-9-]+/%s/" .Values.serviceAccount.name) $key) }}
        {{- fail (printf "externalSecret.remoteSecretName must be <env>/%s/..., got %s" .Values.serviceAccount.name $key) }}
        {{- end }}
        key: {{ $key }}
        property: password
{{- end }}
{{- include "risk.requireMigrationSecret" . }}
---
# Schema owner credential (DB_MIGRATION_USERNAME / _PASSWORD), read only by the
# Flyway migration Job (migration-job.yaml). A hook created before the Job and
# deleted after it succeeds, so the Secret exists only while a migration runs.
# The runtime role (DB_USERNAME) gets only the grants of V11.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "risk.migrationSecretName" . }}
  labels:
    {{- include "risk.migrationLabels" . | nindent 4 }}
  annotations:
    {{- include "risk.migrationPrerequisiteHook" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "risk.migrationSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: DB_MIGRATION_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.migrationSecretName }}
        property: username
    - secretKey: DB_MIGRATION_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.migrationSecretName }}
        property: password
