apiVersion: v1
kind: ConfigMap
metadata:
  {{- /* Required runtime settings: a dropped or empty key fails the render (SERVICE_CALLERS_ELIGIBILITY would
         otherwise admit no service, RISK_HOME_COUNTRY make every internal counterparty high risk, and
         CUSTOMER_SERVICE_URL send the eligibility read nowhere). */ -}}
  {{- range $key := list "DB_URL" "KAFKA_BOOTSTRAP_SERVERS" "OIDC_ISSUER_URI" "OIDC_JWK_SET_URI" "SERVICE_CALLERS_ELIGIBILITY" "RISK_HOME_COUNTRY" "CUSTOMER_SERVICE_URL" }}
  {{- $_ := required (printf "config.%s is required" $key) (get $.Values.config $key) }}
  {{- end }}
  name: {{ include "risk.name" . | quote }}
  labels:
    {{- include "risk.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key | quote }}: {{ $value | quote }}
  {{- end }}
  # Common metric tags (platform outbox alert rules): app = service account, squad = owning squad.
  METRICS_APP: {{ .Values.serviceAccount.name | quote }}
  METRICS_SQUAD: {{ required "metrics.squad is required" .Values.metrics.squad | quote }}
