apiVersion: v1
kind: Service
metadata:
  name: {{ include "risk.name" . | quote }}
  labels:
    {{- include "risk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "risk.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ int .Values.service.port }}
      targetPort: http
    - name: http-management
      port: {{ int .Values.service.managementPort }}
      targetPort: http-management
