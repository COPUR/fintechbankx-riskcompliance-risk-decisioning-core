{{- include "risk.validateDatabaseTls" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "risk.name" . }}
  labels:
    {{- include "risk.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "risk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "risk.selectorLabels" . | nindent 8 }}
        # Mesh membership labels required by the platform contract.
        app: {{ .Values.serviceAccount.name }}
        version: {{ .Values.image.tag | quote }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- include "risk.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "risk.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "risk.selectorLabels" . | nindent 14 }}
      containers:
        - name: risk-decisioning-service
          image: {{ include "risk.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: http-management
              containerPort: {{ .Values.service.managementPort }}
          env:
            # Aurora CA bundle (DB_URL sslrootcert points at the same file); also turns on DatabaseTlsGuard.
            - name: DB_SSL_ROOT_CERT
              value: {{ include "risk.databaseCaFile" . | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "risk.name" . }}
            {{- if .Values.externalSecret.enabled }}
            # The runtime role's credential only. The schema owner's (db-migration)
            # is mounted by the migration Job alone; the service never migrates.
            - secretRef:
                name: {{ include "risk.secretName" . }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "risk.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "risk.databaseCaMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "risk.databaseCaVolume" . | nindent 8 }}
