{{- include "risk.guard" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "risk.name" . | quote }}
  labels:
    {{- include "risk.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ int .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "risk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "risk.selectorLabels" . | nindent 8 }}
        # Mesh membership labels required by the platform contract.
        app: {{ .Values.serviceAccount.name | quote }}
        version: {{ .Values.image.tag | quote }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- include "risk.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: {{ int .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "risk.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ int .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "risk.selectorLabels" . | nindent 14 }}
      containers:
        - name: risk-decisioning-service
          image: {{ include "risk.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ int .Values.service.port }}
            - name: http-management
              containerPort: {{ int .Values.service.managementPort }}
          env:
            # Aurora CA bundle (DB_URL sslrootcert points at the same file). DatabaseTlsGuard, on by default,
            # requires it; KafkaTlsGuard is on by default too (only the local profile and tests switch them off).
            - name: DB_SSL_ROOT_CERT
              value: {{ include "risk.envValue" (list "DB_SSL_ROOT_CERT" (include "risk.databaseCaFile" .)) }}
            # The only Spring profile, from kafka.runtime (fbx.kafkaProfile): kafka-msk (Amazon MSK IAM, SASL_SSL) or
            # kafka-strimzi (Strimzi mutual TLS, SSL). The guard refuses every spring.profiles.* config key.
            - name: SPRING_PROFILES_ACTIVE
              value: {{ include "risk.envValue" (list "SPRING_PROFILES_ACTIVE" (include "fbx.kafkaProfile" .)) }}
            {{- if eq (toString .Values.kafka.runtime) "strimzi" }}
            # KafkaUser client certificate (PEM) for the kafka-strimzi profile.
            - name: KAFKA_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaTls.secretName | quote }}
                  key: {{ .Values.kafkaTls.certKey | quote }}
            - name: KAFKA_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaTls.secretName | quote }}
                  key: {{ .Values.kafkaTls.keyKey | quote }}
            - name: KAFKA_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaTls.secretName | quote }}
                  key: {{ .Values.kafkaTls.caKey | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "risk.name" . | quote }}
            {{- if .Values.externalSecret.enabled }}
            # The runtime role's credential only. The schema owner's (db-migration)
            # is mounted by the migration Job alone; the service never migrates.
            - secretRef:
                name: {{ include "risk.secretName" . | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "risk.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "risk.databaseCaMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "risk.databaseCaVolume" . | nindent 8 }}
