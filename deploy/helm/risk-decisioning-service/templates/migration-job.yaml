{{- include "risk.guard" . -}}
{{- include "risk.requireMigrationSecret" . -}}
# Flyway runs here, never in the service pods (decision 0002). Helm runs this
# Job before it creates or updates any regular resource of the release, on
# install and on upgrade; a failed Job fails the install or upgrade, so the
# Deployment is not rolled out on an unmigrated schema. The service pods hold
# only the runtime role and refuse to start while a migration is pending.
#
# Its own ServiceAccount: on a first install the release's ServiceAccount does
# not exist yet, and the Job needs neither an IAM role (Aurora takes the
# password from the db-migration secret) nor a Kubernetes API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "risk.migrationName" . | quote }}
  labels:
    {{- include "risk.migrationLabels" . | nindent 4 }}
  annotations:
    {{- include "risk.migrationPrerequisiteHook" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "risk.migrationName" . | quote }}
  labels:
    {{- include "risk.migrationLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    # Kept after it finishes (logs, kubectl describe) until ttlSecondsAfterFinished
    # or the next install or upgrade, which replaces it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ int .Values.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ int .Values.migrationJob.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ int .Values.migrationJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "risk.migrationSelectorLabels" . | nindent 8 }}
        {{- toYaml (omit .Values.podLabels "sidecar.istio.io/inject") | nindent 8 }}
        # Written after podLabels, so it overrides their sidecar.istio.io/inject.
        # No Istio sidecar: Aurora egress is a Kubernetes NetworkPolicy on the
        # app.kubernetes.io/name label, so the Job needs no proxy, and without
        # native sidecars an injected proxy would keep the Job from completing.
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: {{ include "risk.migrationName" . | quote }}
      restartPolicy: Never
      securityContext:
        {{- include "risk.podSecurityContext" . | nindent 8 }}
      containers:
        - name: db-migration
          # The service image in migrate-only mode (DatabaseMigration): Flyway
          # migrates as the schema owner, then the process exits.
          image: {{ include "risk.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          args: ["migrate"]
          envFrom:
            # DB_MIGRATION_USERNAME / DB_MIGRATION_PASSWORD (schema owner).
            - secretRef:
                name: {{ include "risk.migrationSecretName" . | quote }}
          env:
            # The DB_URL of the app's ConfigMap, checked by the same guard (risk.guard), set
            # here because the ConfigMap does not exist yet on a first install.
            - name: DB_URL
              value: {{ include "risk.envValue" (list "DB_URL" .Values.config.DB_URL) }}
            # The runtime role V11 grants (Flyway placeholder runtime_role).
            - name: DB_USERNAME
              value: {{ include "risk.envValue" (list "DB_USERNAME" .Values.config.DB_USERNAME) }}
            # Aurora CA bundle; DatabaseTlsGuard, on by default in the Job too, requires it.
            - name: DB_SSL_ROOT_CERT
              value: {{ include "risk.envValue" (list "DB_SSL_ROOT_CERT" (include "risk.databaseCaFile" .)) }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
          securityContext:
            {{- include "risk.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "risk.databaseCaMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "risk.databaseCaVolume" . | nindent 8 }}
