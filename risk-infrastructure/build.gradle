apply plugin: 'jacoco'

description = 'Risk Infrastructure - Web and persistence adapters for risk context'

dependencies {
    implementation project(':risk-domain')
    implementation project(':risk-application')

    // Persistence: own schema sc_rsk_decisioning, Flyway migrations in src/main/resources/db/migration
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Inbound HTTP and security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

jacoco {
    toolVersion = '0.8.14'
}

// The JPA adapter and Spring configuration are covered by risk-bootstrap's
// integration tests against Postgres; this module gates the unit-testable code.
def riskInfrastructureCoverageIncludes = [
    'com/bank/risk/infrastructure/config/RiskConfiguration*',
    'com/bank/risk/infrastructure/persistence/InMemoryRiskAssessmentRepository*',
    'com/bank/risk/infrastructure/persistence/RiskAssessmentPersistenceMapper*',
    'com/bank/risk/infrastructure/web/**'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect { dir ->
            fileTree(dir: dir, include: riskInfrastructureCoverageIncludes)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect { dir ->
            fileTree(dir: dir, include: riskInfrastructureCoverageIncludes)
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
